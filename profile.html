<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rehobot Choir - Member Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Rehobot Choir | Profile</div>
        <nav>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="#" id="logoutBtn" style="color: #f39c12;">Sign Out</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-header">
        <h1>Your Choir Profile</h1>
        <p>Update how other choir members see you on the platform.</p>
    </section>

    <section class="container">
        <div class="contact-form-container" style="max-width: 500px; margin: auto;">
            <form id="profileForm" class="contact-form">
                <div class="form-group">
                    <label for="displayName">Full Name</label>
                    <input type="text" id="displayName" required placeholder="e.g., Abebe Kebede">
                </div>
                <div class="form-group">
                    <label for="voicePart">Voice Part / Section</label>
                    <select id="voicePart" style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;">
                        <option value="Soprano">Soprano</option>
                        <option value="Alto">Alto</option>
                        <option value="Tenor">Tenor</option>
                        <option value="Bass">Bass</option>
                        <option value="Leader / General">Leader / General</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bio">Short Bio</label>
                    <textarea id="bio" rows="3" placeholder="A brief word about yourself..."></textarea>
                </div>
                <button type="submit" class="btn">Save Profile</button>
                <p id="profileMsg" style="color: green; margin-top: 1rem;"></p>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Rehobot Choir. All rights reserved.</p>
    </footer>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const profileForm = document.getElementById('profileForm');
        const profileMsg = document.getElementById('profileMsg');

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    document.getElementById('displayName').value = docSnap.data().displayName || "";
                    document.getElementById('voicePart').value = docSnap.data().voicePart || "Soprano";
                    document.getElementById('bio').value = docSnap.data().bio || "";
                }
            }
        });

        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            try {
                await setDoc(doc(db, "users", user.uid), {
                    displayName: document.getElementById('displayName').value,
                    voicePart: document.getElementById('voicePart').value,
                    bio: document.getElementById('bio').value,
                    email: user.email
                }, { merge: true });

                profileMsg.textContent = "Profile updated successfully!";
                setTimeout(() => profileMsg.textContent = "", 3000);
            } catch (error) {
                console.error("Error saving profile: ", error);
                profileMsg.style.color = "red";
                profileMsg.textContent = "Failed to update profile.";
            }
        });
    </script>
</body>
</html>
