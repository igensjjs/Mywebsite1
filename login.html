<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rehobot Choir - Member Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Rehobot Choir</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-header">
        <h1>Member Portal Login</h1>
        <p>Sign in to access rehearsal schedules, attendance tracking, and choir resources.</p>
    </section>

    <section class="container">
        <div class="contact-form-container" style="max-width: 400px; margin: 2rem auto;">
            <h2>Login</h2>
            <form id="loginForm" class="contact-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn">Sign In</button>
                <p id="error-msg" style="color: red; font-size: 0.85rem; margin-top: 1rem;"></p>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Rehobot Choir. All rights reserved.</p>
    </footer>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('error-msg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('Login successful!');
                window.location.href = 'dashboard.html';
            } catch (error) {
                errorMsg.textContent = error.message;
            }
        });
    </script>
</body>
</html>
