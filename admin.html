<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rehobot Choir - Admin Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo">Rehobot Choir | Admin Panel</div>
        <nav>
            <ul>
                <li><a href="dashboard.html">Member Dashboard</a></li>
                <li><a href="#" id="adminLogoutBtn" style="color: #f39c12; font-weight: 600;">Sign Out</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-header">
        <h1>Admin Control Center</h1>
        <p>Publish announcements, share lyrics, and upload practice audio links for the choir.</p>
    </section>

    <section class="container">
        <div class="dashboard-grid" style="grid-template-columns: 1fr 1fr;">
            
            <!-- 1. Post Announcement Form -->
            <div class="dash-card">
                <h3>📢 Post New Announcement</h3>
                <form id="announcementForm" class="contact-form" style="margin-top: 1rem;">
                    <div class="form-group">
                        <label for="announcementTitle">Title</label>
                        <input type="text" id="announcementTitle" required placeholder="e.g., Special Rehearsal">
                    </div>
                    <div class="form-group">
                        <label for="announcementText">Message Details</label>
                        <textarea id="announcementText" rows="3" required placeholder="Type details here..."></textarea>
                    </div>
                    <button type="submit" class="btn">Publish Announcement</button>
                    <p id="admin-msg-1" style="color: green; font-size: 0.85rem; margin-top: 0.5rem;"></p>
                </form>
            </div>

            <!-- 2. Upload Lyrics or Audio Link Form -->
            <div class="dash-card">
                <h3>🎵 Upload Lyrics or Audio Link</h3>
                <form id="resourceForm" class="contact-form" style="margin-top: 1rem;">
                    <div class="form-group">
                        <label for="resourceTitle">Song Title / Description</label>
                        <input type="text" id="resourceTitle" required placeholder="e.g., Gaaddisa Waaqayyoo (Soprano Track)">
                    </div>
                    <div class="form-group">
                        <label for="resourceType">Category</label>
                        <select id="resourceType" style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;">
                            <option value="Audio Track">Audio Track (MP3 Link)</option>
                            <option value="Lyrics">Lyrics Text</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="resourceContent">Link URL or Lyrics Text</label>
                        <textarea id="resourceContent" rows="3" required placeholder="Paste MP3 link (Google Drive/Dropbox) or type lyrics here..."></textarea>
                    </div>
                    <button type="submit" class="btn">Publish Resource</button>
                    <p id="admin-msg-2" style="color: green; font-size: 0.85rem; margin-top: 0.5rem;"></p>
                </form>
            </div>

        </div>
    </section>

    <footer>
        <p>&copy; 2026 Rehobot Choir. All rights reserved.</p>
    </footer>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const adminLogoutBtn = document.getElementById('adminLogoutBtn');
        const announcementForm = document.getElementById('announcementForm');
        const resourceForm = document.getElementById('resourceForm');
        const adminMsg1 = document.getElementById('admin-msg-1');
        const adminMsg2 = document.getElementById('admin-msg-2');

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
            }
        });

        // Handle Announcements
        announcementForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('announcementTitle').value;
            const text = document.getElementById('announcementText').value;

            try {
                await addDoc(collection(db, "announcements"), {
                    title, text, createdAt: new Date()
                });
                adminMsg1.textContent = "Published successfully!";
                announcementForm.reset();
                setTimeout(() => adminMsg1.textContent = "", 3000);
            } catch (error) {
                adminMsg1.style.color = "red";
                adminMsg1.textContent = "Error: " + error.message;
            }
        });

        // Handle Practice Resources & Lyrics
        resourceForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('resourceTitle').value;
            const type = document.getElementById('resourceType').value;
            const content = document.getElementById('resourceContent').value;

            try {
                await addDoc(collection(db, "resources"), {
                    title, type, content, createdAt: new Date()
                });
                adminMsg2.textContent = "Resource published successfully!";
                resourceForm.reset();
                setTimeout(() => adminMsg2.textContent = "", 3000);
            } catch (error) {
                adminMsg2.style.color = "red";
                adminMsg2.textContent = "Error: " + error.message;
            }
        });

        adminLogoutBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await signOut(auth);
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error signing out:', error);
            }
        });
    </script>
</body>
</html>
