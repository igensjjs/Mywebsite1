<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rehobot Choir - Admin Portal</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <div class="logo">Rehobot Choir | Admin Panel</div>
        <nav>
            <ul>
                <li><a href="dashboard.html">Member Dashboard</a></li>
                <li><a href="#" id="adminLogoutBtn" style="color: #f39c12; font-weight: 600;">Sign Out</a></li>
            </ul>
        </nav>
    </header>

    <!-- Page Header Banner -->
    <section class="page-header">
        <h1>Admin Control Center</h1>
        <p>Post announcements, update rehearsal dates, and manage choir platform content.</p>
    </section>

    <!-- Admin Form Section -->
    <section class="container">
        <div class="contact-grid" style="grid-template-columns: 1fr; max-width: 700px; margin: auto;">
            
            <div class="contact-form-container">
                <h2>Post New Announcement</h2>
                <form id="announcementForm" class="contact-form">
                    <div class="form-group">
                        <label for="announcementTitle">Announcement Title</label>
                        <input type="text" id="announcementTitle" required placeholder="e.g., Special Rehearsal">
                    </div>
                    <div class="form-group">
                        <label for="announcementText">Message Details</label>
                        <textarea id="announcementText" rows="4" required placeholder="Type the announcement details here..."></textarea>
                    </div>
                    <button type="submit" class="btn">Publish Announcement</button>
                    <p id="admin-msg" style="color: green; font-size: 0.9rem; margin-top: 1rem;"></p>
                </form>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Rehobot Choir. All rights reserved.</p>
    </footer>

    <!-- Script to handle Admin Authentication and Posting to Firebase -->
    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const adminLogoutBtn = document.getElementById('adminLogoutBtn');
        const announcementForm = document.getElementById('announcementForm');
        const adminMsg = document.getElementById('admin-msg');

        // Protect route - ensure user is logged in
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
            }
        });

        // Handle Posting Announcement to Firestore Database
        announcementForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('announcementTitle').value;
            const text = document.getElementById('announcementText').value;

            try {
                await addDoc(collection(db, "announcements"), {
                    title: title,
                    text: text,
                    createdAt: new Date()
                });
                adminMsg.textContent = "Announcement published successfully!";
                announcementForm.reset();
                setTimeout(() => adminMsg.textContent = "", 4000);
            } catch (error) {
                console.error("Error adding document: ", error);
                adminMsg.style.color = "red";
                adminMsg.textContent = "Error: " + error.message;
            }
        });

        // Handle Logout
        adminLogoutBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await signOut(auth);
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error signing out:', error);
            }
        });
    </script>
</body>
</html>
